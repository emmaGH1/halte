<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halte — Stolen watches, unsellable.</title>
<style>
@font-face {font-family:Satoshi;src:url('../film/v4/assets/fonts/Satoshi-500.woff2');font-weight:500}
@font-face {font-family:Satoshi;src:url('../film/v4/assets/fonts/Satoshi-700.woff2');font-weight:700}
@font-face {font-family:Geist Mono;src:url('../film/v4/assets/fonts/GeistMono.woff2')}
* {box-sizing:border-box}
body {margin:0;background:#07070a;color:#eceae4;font-family:Satoshi,sans-serif}
main {position:relative;width:100vw;aspect-ratio:16/9;overflow:hidden}
canvas {position:absolute;inset:0;width:100%;height:100%}
.brand,h1,footer {position:absolute;left:8%}
.brand {top:8%;font-size:2.9vw;font-weight:700;letter-spacing:-.065em}
h1 {top:50%;transform:translateY(-50%);margin:0;font-weight:500;font-size:7.35vw;line-height:.96;letter-spacing:-.066em}
h1 span {display:block;color:#ff4526}
footer {bottom:8%;font:1.72vw 'Geist Mono',monospace;color:#cdccc6;letter-spacing:-.035em}
</style>
</head>
<body>
<main>
<canvas width="1920" height="1080" aria-hidden="true"></canvas>
<div class="brand">Halte</div>
<h1>Stolen watches,<span>unsellable.</span></h1>
<footer>Live on QoreChain Diana · ML-DSA-87</footer>
</main>
<script>
// Fixed print frame of the site's lattice. The freeze radiates from the crown.
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const gap = 12, radius = 367, cx = 1482, cy = 540;
const hands = [[27,.82,1.2],[300,.60,2.2],[50,.42,2.6]].map(([angle,length,width]) => {
  const a = (angle-90)*Math.PI/180;
  return {cos:Math.cos(a),sin:Math.sin(a),length:length*radius,width};
});
for (let y=gap/2;y<1080;y+=gap) {
  for (let x=gap/2;x<1920;x+=gap) {
    const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy);
    const seed=Math.sin(x*127.1+y*311.7)*43758.5453;
    const noise=seed-Math.floor(seed);
    const angle=Math.atan2(dy,dx);
    const hour=Math.round(angle/(2*Math.PI)*60)%5===0;
    const rim=Math.abs(d-radius)<gap*.7;
    const tick=hour && Math.abs(d-radius*.9)<gap*.65;
    const crown=Math.abs(dy)<gap*1.2 && dx>radius && dx<radius+gap*2.2;
    const hand=d<radius*.9 && hands.some(h => {
      const along=dx*h.cos+dy*h.sin;
      return along>-gap && along<h.length && Math.abs(dy*h.cos-dx*h.sin)<gap*.45*h.width;
    });
    const lit=rim || tick || crown || hand || d<gap*.9;
    const wave=Math.hypot(dx-radius,dy);
    const frozen=wave<radius*1.32;
    const falloff=Math.max(0,1-Math.max(0,d-radius*.88)/(radius*.68));
    let opacity=lit ? .98 : (.09+.08*noise)*falloff;
    if (frozen && !lit) opacity+=.09*falloff;
    ctx.fillStyle=frozen?'#ff4526':'#eceae4';
    ctx.globalAlpha=opacity;
    ctx.beginPath();
    ctx.arc(x,y,lit?4.5:2.1,0,2*Math.PI);
    ctx.fill();
  }
}
</script>
</body>
</html>
